<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qr scan</title>
    <!-- jsQR Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
    <div id="real">
        <video id="vid" playsinline></video>
    </div>
    
    <!-- Controls & Results -->
    <div class="controls">
        <button id="scanBtn" onclick="toggleScanner()">Start Scanner</button>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <div id="result">
        <h2>result</h2>
        <div id="out">Scanner is OFF. Click Start to scan.</div>
    </div>

    <script>
        // Adafruit IO Credentials
        const AIO_USERNAME = "zrywxt";
        const AIO_KEY = "aio_PZjh85j4RMX8WFdd8pqrkiRpdryi";
        const FEED_KEY = "qr-data";

        const video = document.getElementById('vid');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const outDiv = document.getElementById('out');
        const scanBtn = document.getElementById('scanBtn');

        let mediaStream = null;
        let isScanning = false;
        let isCooldown = false;
        let animationFrameId = null;

        function toggleScanner() {
            if (isScanning) {
                stopScanner();
            } else {
                startScanner();
            }
        }

        function startScanner() {
            const constraints = { video: { facingMode: { ideal: "environment" } } };

            outDiv.innerText = "Requesting camera access...";

            navigator.mediaDevices.getUserMedia(constraints)
                .then((stream) => {
                    mediaStream = stream;
                    video.srcObject = stream;
                    video.play();
                    
                    isScanning = true;
                    scanBtn.innerText = "Stop Scanner";
                    scanBtn.classList.add("active");
                    outDiv.innerText = "Scanning for QR codes...";

                    animationFrameId = requestAnimationFrame(tick);
                })
                .catch((err) => {
                    outDiv.innerText = "Camera access denied or unsecure context (requires HTTPS).";
                });
        }

        function stopScanner() {
            isScanning = false;
            
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            video.srcObject = null;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            scanBtn.innerText = "Start Scanner";
            scanBtn.classList.remove("active");
            outDiv.innerText = "Scanner is OFF. Click Start to scan.";
        }

async function sendToAdafruit(scannedValue) {
    outDiv.innerText = "Sending " + scannedValue + " to Adafruit...";

    try {
        const response = await fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/${FEED_KEY}/data`, {
            method: "POST",
            headers: {
                "X-AIO-Key": AIO_KEY,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ value: scannedValue })
        });

        if (response.ok) {
            outDiv.innerText = "Sent successfully: " + scannedValue;
        } else {
            // Displays exact HTTP error code (e.g. 401 Unauthorized, 404 Not Found, 429 Rate Limited)
            outDiv.innerText = `Adafruit Error: ${response.status} - ${response.statusText}`;
        }
    } catch (err) {
        outDiv.innerText = "Network error. Check connection.";
    } finally {
        setTimeout(() => { 
            isCooldown = false; 
        }, 3000);
    }
}

        function tick() {
            if (!isScanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA && !isCooldown) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    isCooldown = true;
                    sendToAdafruit(code.data);
                }
            }
            animationFrameId = requestAnimationFrame(tick);
        }
    </script>
</body>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        background-color: #000;
        font-family: sans-serif;
    }
    #real{
        width: 50%;
        height: 40vh;
        background-color: #292929;
        border-radius: 10px;
        margin-left: 25%;
        margin-top: 5vh;
        overflow: hidden;
    }
    #vid{
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .controls {
        text-align: center;
        margin-top: 20px;
    }
    #scanBtn {
        padding: 12px 28px;
        font-size: 1rem;
        font-weight: bold;
        color: white;
        background-color: rgb(0, 145, 255);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s ease;
    }
    #scanBtn.active {
        background-color: #ff3344;
    }
    #scanBtn:hover {
        opacity: 0.9;
    }
    #result {
        height: 20vh;
        width: 50%;
        border-radius: 15px;
        background-color: #292929;
        border: 2px solid rgb(0, 145, 255);
        color: white;
        margin-left: 25%;
        margin-top: 3vh;
        text-align: center;
        padding: 10px;
    }
    h2 {
        text-transform: capitalize;
    }
    #out {
        margin-top: 4%;
        word-break: break-all;
        color: #00ffcc;
        font-weight: bold;
    }
</style>
</html>
