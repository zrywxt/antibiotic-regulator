<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qr scan</title>
    <!-- jsQR Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
    <div id="real">
        <video id="vid" playsinline></video>
    </div>
    
    <!-- Hidden canvas used for processing frames -->
    <canvas id="canvas" style="display: none;"></canvas>

    <div id="result">
        <h2>result</h2>
        <div id="out">The Scanned text says</div>
    </div>

    <script>
        const video = document.getElementById('vid');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const outDiv = document.getElementById('out');

        // Request access to rear camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then((stream) => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(tick);
            })
            .catch((err) => {
                outDiv.innerText = "Camera access denied or not supported.";
            });

        // Frame scanner loop
        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Match canvas size to video frame
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                // Draw current frame to hidden canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Extract pixel data
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                // Decode QR pattern
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    outDiv.innerText = code.data;
                }
            }
            requestAnimationFrame(tick);
        }
    </script>
</body>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        background-color: #000;
        font-family: sans-serif;
    }
    #real{
        width: 50%;
        height: 40vh;
        background-color: #292929;
        border-radius: 10px;
        margin-left: 25%;
        margin-top: 10vh;
        overflow: hidden;
    }
    /* Added styling so video fills the container correctly */
    #vid{
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    #result {
        height: 25vh;
        width: 50%;
        border-radius: 15px;
        background-color: #292929;
        border: 2px solid rgb(0, 145, 255);
        color: white;
        margin-left: 25%;
        margin-top: 10vh;
        text-align: center;
        padding: 10px;
    }
    h2 {
        text-transform: capitalize;
    }
    #out {
        margin-top: 5%;
        word-break: break-all;
        color: #00ffcc;
        font-weight: bold;
    }
</style>
</html>
