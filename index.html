<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner</title>
  <!-- Open-source client-side QR scanner library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }
    #result-box {
      margin-top: 20px;
      width: 100%;
      max-width: 400px;
      padding: 15px;
      background: #1e1e1e;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #333;
    }
    .result-title {
      font-size: 0.85rem;
      color: #aaaaaa;
      margin-bottom: 5px;
    }
    #scanned-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: #00ffcc;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h1>QR Code Scanner</h1>

  <!-- Camera video feed renders inside this container -->
  <div id="reader"></div>

  <!-- Screen output container -->
  <div id="result-box">
    <div class="result-title">Scanned Result:</div>
    <div id="scanned-text">Waiting for QR code...</div>
  </div>

  <script>
    function onScanSuccess(decodedText) {
      // Print the decoded QR code value to the screen
      document.getElementById('scanned-text').innerText = decodedText;
    }

    // Initialize the scanner widget
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { fps: 10, qrbox: { width: 250, height: 250 } }, 
      false
    );

    html5QrcodeScanner.render(onScanSuccess);
  </script>

</body>
</html>
