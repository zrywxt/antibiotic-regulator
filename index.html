<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
    <video playsinline autoplay id="vid"></video>
    <button id="btn">Start</button>
    <p id="result"></p>

<script>
const vid = document.getElementById("vid");
const btn = document.getElementById("btn");
const p = document.querySelector("#result");
const canvas = document.createElement("canvas");
const makeCanvas2d = canvas.getContext("2d");


// Adadfruit IO thng is vibe coded
const aioUsername = "zrywxt";
const aioKey = "aio_wdbu292VvkS4Ud3mTjBZXi8tXOAeE";
const feedName = "qr-data";

async function sendToAdafruit(qrData) {
  const url = `https://io.adafruit.com/api/v2/${aioUsername}/feeds/${feedName}/data`;

  try {
    const response = await fetch(url, {
      method: "POST",
      headers: {
        "X-AIO-Key": aioKey,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        value: qrData
      })
    });

    if (response.ok) {
      console.log("Successfully sent to Adafruit IO!");
      p.innerText = "Scanned and sent: " + qrData;
    } else {
      console.error("Adafruit IO Error:", response.statusText);
      p.innerText = "Failed to send to Adafruit IO.";
    }
  } catch (error) {
    console.error("Network Error:", error);
    p.innerText = "Network error while sending.";
  }
}



function scanQr() {
    if (vid.readyState === vid.HAVE_ENOUGH_DATA) {
        canvas.height = vid.videoHeight;
        canvas.width = vid.videoWidth;

        makeCanvas2d.drawImage(vid, 0, 0, canvas.width, canvas.height);
        const rawQr = makeCanvas2d.getImageData(0, 0, canvas.width, canvas.height);
        const cream = jsQR(rawQr.data, rawQr.width, rawQr.height);

        if (cream) {
            console.log("The camera reads it's:", cream.data);
            p.innerText = cream.data; // Fixed: extracts text string
            stopQr();
            return; // Stops loop on successful scan
        }
    }

    // Keeps scanning frame by frame while camera is on
    if (incominVideo) {
        requestAnimationFrame(scanQr);
    }
}

const recordingPrefrences = {
    video: { facingMode: { ideal: "environment" } },
    audio: false
};

let incominVideo = null;

async function recordQr() {
    try {
        incominVideo = await navigator.mediaDevices.getUserMedia(recordingPrefrences);
        vid.srcObject = incominVideo;
        requestAnimationFrame(scanQr);
        btn.textContent = "Stop";
    } catch(someError) {
        console.log(someError);
    }
}

function stopQr() {
    if (incominVideo) {
        incominVideo.getTracks().forEach(track => track.stop());
        vid.srcObject = null;
        incominVideo = null;
        btn.textContent = "Start";
    }
}

btn.addEventListener("click", () => {
    if (incominVideo) {
        stopQr();
    } else {
        recordQr();
    }
});
</script>
</body>
</html>
